<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic TMGSS</title>
  <link rel="icon" type="image/jpeg" href="IMG/smallIcon.jpg">

      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #04020a;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      padding: 20px;
    }
    .title-svg {
      width: 70%;
      max-width: 750px; /* Scaled x1.5 */
      max-height: 33vh;  /* Scaled x1.5 */
      height: auto;
      object-fit: contain;
      pointer-events: auto;
      display: block;
    }
    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px; /* Scaled x1.5 */
      margin-top: 22px;
      width: 100%;
      pointer-events: auto;
    }
    .menu-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      padding: 12px 36px; /* Scaled x1.5 */
      border-radius: 30px; /* Scaled x1.5 */
      text-decoration: none;
      font-size: clamp(20px, 2.25vw, 24px); /* Scaled x1.5 */
      transition: all 0.3s ease;
      backdrop-filter: blur(6px);
      text-align: center;
    }
    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
    }
    .site-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>

    <div id="menuContainer" class="menu-container"></div>
  </div>

    <span class="footer-left">Made By Carlos Cosmic2026@TMGSS</span>
    <span class="footer-right">To Infinity And Beyond Cosmic Is Never Gone</span>
