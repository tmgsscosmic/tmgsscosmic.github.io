<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC 萬聖節鬼屋</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="https://tmgsscosmic.github.io/IMG/smallIcon.jpg">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        /* Scale iframe content to 75% zoom while filling full screen */
        .iframe-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .scaled-iframe {
            border: 0;
            margin: 0;
            padding: 0;
            width: 133.333333%;
            height: 133.333333%;
            transform: scale(0.75);
            transform-origin: 0 0;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-full w-full overflow-hidden m-0 p-0 flex flex-col relative select-none">

    <!-- Redirect / Sign Out Button -->
    <a target="_blank" href="https://myaccount.google.com/" 
       class="absolute top-4 right-4 z-50 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs sm:text-sm rounded-lg shadow-lg transition-all flex items-center gap-2 border border-indigo-400/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span>換學校Account</span>
    </a>

    <!-- Main Viewport Container -->
    <main class="iframe-container bg-gray-950">
        <!-- Initial Loading Overlay -->
        <div id="loadingIndicator" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-950 z-10 transition-opacity duration-500">
            <div class="relative w-10 h-10 mb-4">
                <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin"></div>
            </div>
            <p class="text-sm font-medium text-gray-300">Loading Web Application...</p>
        </div>

        <!-- 75% Rescaled Iframe -->
        <iframe 
            id="appIframe"
            src="https://script.google.com/a/macros/mail.tmgss.edu.hk/s/AKfycbzzuu67g9LPk3hExLl4iOnLtyPiGYHVRuvwXgiag8OoOCs2L8I4WrXgtWtb5ZuOMFDW/exec"
            allow="geolocation; microphone; camera; midi; encrypted-media; autoplay; clipboard-write; clipboard-read; storage-access;"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation ​allow-storage-access-by-user-activation"
            class="scaled-iframe relative z-20"
            onload="checkIframeContent()"
        ></iframe>
    </main>

    <script>
        // Hide loading spinner when ready
        function hideLoading() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.pointerEvents = 'none';
                }, 500);
            }
        }

        // Detect target string inside iframe DOM and alert user
        function checkIframeContent() {
            hideLoading();
            try {
                const iframe = document.getElementById('appIframe');
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                if (iframeDoc && iframeDoc.body) {
                    const htmlContent = iframeDoc.body.innerHTML;
                    if (htmlContent.includes('<strong>www.google.com</strong>')) {
                        alert('請切換至學校 Google 帳號 (Please switch to your school Google account)!');
                    }
                }
            } catch (err) {
                // Cross-Origin security policies will block DOM inspection if domains do not match
                console.warn('Unable to inspect iframe DOM due to same-origin restrictions:', err);
            }
        }

        // Safety timeout for loading indicator
        setTimeout(() => {
            hideLoading();
        }, 4000);
    </script>
</body>
</html>
